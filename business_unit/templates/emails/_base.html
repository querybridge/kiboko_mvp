<!doctype html>
<html><body style="margin:0; padding:0; background:#F5F1FA; font-family:Inter,Helvetica,Arial,sans-serif; color:#1A0F36;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5F1FA; padding:28px 12px;"><tr><td align="center">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background:#FFFFFF; border:1px solid #E0D0F5; border-radius:14px;">
    <tr><td style="padding:22px 28px 0; font-size:18px; font-weight:800; color:#432A85; letter-spacing:.02em;">Kiboko</td></tr>
    <tr><td style="padding:14px 28px 26px; font-size:15px; line-height:1.55;">
      {% block body %}{% endblock %}
    </td></tr>
  </table>
  <p style="font-size:12px; color:#6A5A8C; margin:14px 0 0;">Kiboko &middot; RevOps platform for eCommerce</p>
  {% if unsubscribe_url %}<p style="font-size:12px; color:#6A5A8C; margin:8px 0 0;">Don’t want {{ unsubscribe_label }}? <a href="{{ unsubscribe_url }}" style="color:#432A85;">Unsubscribe</a> or change it in <a href="{{ site_url }}{% url 'users:profile' %}" style="color:#432A85;">User Settings</a>.</p>{% endif %}
</td></tr></table>
</body></html>

{% extends "emails/_base.html" %}
{% block body %}
<p style="margin-top:0;"><strong>Feedback from {{ who }}</strong>{% if email %} &lt;{{ email }}&gt;{% endif %}</p>
<p style="font-size:13px; color:#6A5A8C;">User: {{ username }} (id {{ user_id }}){% if org %}<br>Organization: {{ org }}{% endif %}<br>Page: {{ page }}</p>
<div style="border-left:3px solid #6B4BC9; padding:4px 0 4px 14px; white-space:pre-wrap;">{{ message }}</div>
<p style="font-size:13px; color:#6A5A8C;">Reply to this email to answer them directly.</p>
{% endblock %}

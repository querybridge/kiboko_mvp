<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiboko | {% block title %}{% endblock %}</title>
  <link rel="icon" href="/static/images/kiboko-favicon.ico" sizes="any">
  <link rel="icon" href="/static/images/kiboko-mark.svg" type="image/svg+xml">
  <link href="/static/fonts/fonts.css?v=1" rel="stylesheet">
  <script>
    (function () {
      try { if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('theme-light'); } catch (e) {}
    })();
  </script>
  <style>
    :root { --bg: #0E081A; --card: #170E2B; --border: #2F1F55; --text: #F4EEFC; --text-2: #C8BCDF;
      --muted: #A493C4; --link: #D6C5F7; --callout: #221640; }
    html.theme-light { --bg: #F4F2F8; --card: #FFFFFF; --border: #DDD6EC; --text: #1C1530; --text-2: #3E3658;
      --muted: #5C5474; --link: #432A85; --callout: #F1ECFA; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text-2);
      font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.65; }
    .lg-top { max-width: 820px; margin: 0 auto; padding: 24px 16px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .lg-logo { height: 68px; width: auto; display: block; }
    .logo-for-light { display: none; }
    html.theme-light .logo-for-dark { display: none; }
    html.theme-light .logo-for-light { display: block; }
    .lg-nav { font-size: 14px; display: flex; gap: 16px; flex-wrap: wrap; }
    a { color: var(--link); text-underline-offset: 3px; }
    .lg-card { max-width: 820px; margin: 20px auto 32px; background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 36px 40px; }
    h1 { font-family: "Space Grotesk", Inter, sans-serif; color: var(--text); font-size: 30px; margin: 0 0 4px; }
    h2 { color: var(--text); font-size: 18px; margin: 32px 0 8px; }
    h3 { color: var(--text); font-size: 15px; margin: 20px 0 6px; }
    .lg-updated { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
    .lg-callout { background: var(--callout); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin: 18px 0; }
    .lg-callout p { margin: 4px 0; }
    ul { padding-left: 22px; }
    li { margin: 4px 0; }
    strong { color: var(--text); }
    .lg-foot { max-width: 820px; margin: 0 auto 40px; padding: 0 16px; font-size: 13px; color: var(--muted); text-align: center; }
    a:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; border-radius: 3px; }
    @media (max-width: 640px) { .lg-card { padding: 24px 18px; border-radius: 10px; } h1 { font-size: 24px; } }
  </style>
</head>
<body>
  <header class="lg-top">
    <a href="/" aria-label="Kiboko home"><img src="/static/images/kiboko-logo-white.svg" alt="Kiboko" class="lg-logo logo-for-dark"><img src="/static/images/kiboko-logo-purple.svg" alt="Kiboko" class="lg-logo logo-for-light"></a>
    <nav class="lg-nav">
      <a href="/" id="lg-back">Back</a>
      <a href="{% url 'legal_privacy' %}">Privacy</a>
      <a href="{% url 'legal_terms' %}">Terms</a>
    </nav>
  </header>
  <main class="lg-card">
    {% block body %}{% endblock %}
  </main>
  <footer class="lg-foot">Kiboko is a service of Kiboko Method LLC. Questions? Email <a href="mailto:info@kibokomethod.com">info@kibokomethod.com</a>.</footer>
  <script>
    (function () {
      // "Back" returns to the page the user came from inside Kiboko; otherwise home.
      var back = document.getElementById('lg-back');
      var cameFromHere = document.referrer && document.referrer.indexOf(window.location.origin) === 0;
      if (cameFromHere && window.history.length > 1) {
        back.addEventListener('click', function (e) { e.preventDefault(); window.history.back(); });
      }
    })();
  </script>
</body>
</html>

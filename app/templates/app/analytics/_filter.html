{# Date + comparison period filter. Auto-submits (JS in _scripts.html). #}
<form id="analytics-filter" method="get">
  <div class="af-group">
    <label for="af-period">Period</label>
    <select id="af-period" name="period">
      {% for code, label, days in primary_options %}
        <option value="{{ code }}" {% if code == selected_primary %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="af-group af-custom" id="af-custom" {% if selected_primary != 'CUSTOM' %}style="display:none;"{% endif %}>
    <span id="af-daterange" class="af-daterange" role="button" tabindex="0" title="Pick a custom date range">
      <i class="fa fa-calendar"></i>
      <span id="af-daterange-label">{% if selected_custom_start %}{{ selected_custom_start }} &ndash; {{ selected_custom_end }}{% else %}Select dates{% endif %}</span>
      <i class="fa fa-caret-down"></i>
    </span>
    <input type="hidden" id="af-custom-start" name="custom_start" value="{{ selected_custom_start }}">
    <input type="hidden" id="af-custom-end" name="custom_end" value="{{ selected_custom_end }}">
  </div>
  <div class="af-vs">compared to</div>
  <div class="af-group">
    <label for="af-compare">Comparison period</label>
    <select id="af-compare" name="compare">
      {% for code, label in compare_options %}
        <option value="{{ code }}" {% if code == selected_compare %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <noscript><button type="submit" class="btn btn-primary btn-sm">Apply</button></noscript>
</form>

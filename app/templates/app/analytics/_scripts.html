{# Shared analytics JS. Include in the javascripts block after defining ANALYTICS_CHARTS (line/area) and optionally ANALYTICS_SCATTER (changeplots). #}
<script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js"></script>
<script>
(function() {
  // ---- Filter auto-submit -------------------------------------------------
  var period = document.getElementById('af-period');
  var compare = document.getElementById('af-compare');
  var afCustom = document.getElementById('af-custom');

  // Custom range: a calendar-icon chip opens the bootstrap-daterangepicker.
  var $dr = (window.jQuery && jQuery.fn.daterangepicker) ? jQuery('#af-daterange') : null;
  if ($dr && $dr.length) {
    var startEl = document.getElementById('af-custom-start');
    var endEl = document.getElementById('af-custom-end');
    var labelEl = document.getElementById('af-daterange-label');
    $dr.daterangepicker({
      startDate: startEl.value ? moment(startEl.value) : moment().subtract(29, 'days'),
      endDate: endEl.value ? moment(endEl.value) : moment().subtract(1, 'days'),
      showDropdowns: true, linkedCalendars: false, autoUpdateInput: true,
      opens: 'center', locale: { format: 'YYYY-MM-DD', firstDay: 1 }
    }, function(start, end) {
      startEl.value = start.format('YYYY-MM-DD');
      endEl.value = end.format('YYYY-MM-DD');
      if (labelEl) labelEl.textContent = start.format('MMM D, YYYY') + ' – ' + end.format('MMM D, YYYY');
      document.getElementById('analytics-filter').submit();   // apply the range
    });
  }

  if (period) period.addEventListener('change', function() {
    if (period.value === 'CUSTOM') {
      if (afCustom) afCustom.style.display = '';   // reveal the calendar chip...
      if ($dr && $dr.data('daterangepicker')) $dr.data('daterangepicker').show();  // ...and open it
    } else {
      window.location.search = '?period=' + encodeURIComponent(period.value);
    }
  });
  if (compare) compare.addEventListener('change', function() {
    if (period && period.value === 'CUSTOM') {
      document.getElementById('analytics-filter').submit();   // keep the custom dates
    } else {
      window.location.search = '?period=' + encodeURIComponent(period.value) +
                               '&compare=' + encodeURIComponent(compare.value);
    }
  });

  // ---- Drill-down: clicking a linked card navigates to its dashboard ------
  Array.prototype.forEach.call(document.querySelectorAll('.analytics-card[data-card-link]'), function(card) {
    card.addEventListener('click', function(e) {
      if (e.target.closest('a')) return;  // explicit links (the chevron) handle themselves
      window.location.href = card.getAttribute('data-card-link');
    });
  });

  if (typeof Chart === 'undefined') return;

  // Light defaults so axes / legends read on the dark card surface.
  Chart.defaults.global.defaultFontColor = '#C8BCDF';
  Chart.defaults.global.defaultFontFamily = "'Inter', system-ui, sans-serif";
  var GRID = 'rgba(255,255,255,0.06)';

  var GROUP_COLORS = {
    grow:    { line: '#A98EE8', fill: 'rgba(169,142,232,0.16)', line2: '#7A6AA0', fill2: 'rgba(122,106,160,0.14)' },
    attract: { line: '#3FC9E0', fill: 'rgba(63,201,224,0.16)',  line2: '#2C7C8A', fill2: 'rgba(63,201,224,0.08)' },
    engage:  { line: '#ECB752', fill: 'rgba(236,183,82,0.18)',  line2: '#96793C', fill2: 'rgba(236,183,82,0.08)' },
    expand:  { line: '#55C892', fill: 'rgba(85,200,146,0.16)',  line2: '#387A5C', fill2: 'rgba(85,200,146,0.08)' }
  };

  function abbr(n) {
    n = +n; var a = Math.abs(n);
    if (a >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (a >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return Math.round(n).toLocaleString();
  }
  function fmtVal(v, kind) {
    if (kind === 'currency') return '$' + abbr(v);
    if (kind === 'percentage') return (+v).toFixed(2) + '%';
    if (kind === 'integer') return abbr(v);
    return (+v).toFixed(2);
  }
  window.analyticsFmtVal = fmtVal;

  // ---- Line / area charts -------------------------------------------------
  function dataset(label, data, line, fill, twoSets) {
    return {
      label: label, data: data,
      borderColor: line, backgroundColor: fill, pointBackgroundColor: line,
      borderWidth: 2, pointRadius: twoSets ? 2 : 0, pointHoverRadius: 4,
      fill: true, lineTension: 0.35
    };
  }
  if (window.ANALYTICS_CHARTS) Object.keys(ANALYTICS_CHARTS).forEach(function(id) {
    var c = ANALYTICS_CHARTS[id];
    var el = document.getElementById('chart-' + id);
    if (!el) return;
    var col = GROUP_COLORS[c.group] || GROUP_COLORS.grow;
    var datasets = [dataset(c.main_label, c.s1, col.line, col.fill, c.two_sets)];
    if (c.s2) datasets.push(dataset(c.compare_label, c.s2, col.line2, col.fill2, c.two_sets));
    new Chart(el.getContext('2d'), {
      type: 'line',
      data: { labels: c.labels, datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        legend: { display: c.two_sets, position: 'bottom', labels: { boxWidth: 12, fontSize: 11 } },
        tooltips: {
          mode: 'index', intersect: false,
          callbacks: { label: function(item, data) {
            return (data.datasets[item.datasetIndex].label || '') + ': ' + fmtVal(item.yLabel, c.format);
          } }
        },
        hover: { mode: 'index', intersect: false },
        scales: {
          xAxes: [{ display: c.two_sets, gridLines: { display: false }, ticks: { fontSize: 10, maxRotation: 0, autoSkip: true, maxTicksLimit: 8 } }],
          yAxes: [{ display: c.two_sets, gridLines: { color: GRID, zeroLineColor: GRID }, ticks: { fontSize: 10, callback: function(v) { return fmtVal(v, c.format); } } }]
        }
      }
    });
  });

  // ---- Scatter changeplots (raw-value axes, ITG-faithful readout) ----------
  function cpFmtDelta(delta, label) {
    // "N more Orders" / "(N) fewer Units" / "$N lower Sales" — Sales is currency
    // and says "lower" for a decline. (Mirrors the ITG changeplot readout.)
    var isSales = (label === 'Sales');
    var absv = Math.abs(delta);
    var absStr = isSales ? '$' + absv.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})
                         : Math.round(absv).toLocaleString();
    var word = delta > 0 ? 'more' : (isSales ? 'lower' : 'fewer');
    var unit = (Math.round(absv) === 1) ? String(label).slice(0, -1) : label;
    return (delta < 0 ? '(' + absStr + ') ' : absStr + ' ') + word + ' ' + unit;
  }
  function cpPctStr(change) {
    var s = Math.abs(change).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%';
    return change >= 0 ? s : '(' + s + ')';
  }
  // Raw-number axis tick (ITG): "-" at zero, (n) for negatives, thousands sep.
  function cpAxisTick(v) {
    if (v === 0) return '-';
    var s = Math.abs(v).toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 2});
    return v < 0 ? '(' + s + ')' : s;
  }
  // Least-squares trend through the plotted (raw-delta) points; endpoints span x.
  function cpTrend(pts) {
    var n = pts.length; if (n < 2) return null;
    var mx = 0, my = 0, i;
    for (i = 0; i < n; i++) { mx += pts[i].x; my += pts[i].y; }
    mx /= n; my /= n;
    var num = 0, den = 0;
    for (i = 0; i < n; i++) { num += (pts[i].x - mx) * (pts[i].y - my); den += (pts[i].x - mx) * (pts[i].x - mx); }
    if (!den) return null;
    var slope = num / den, b = my - slope * mx, xs = pts.map(function(p){ return p.x; });
    var x1 = Math.min.apply(null, xs), x2 = Math.max.apply(null, xs), pad = (x2 - x1) * 0.08 || 1;
    x1 -= pad; x2 += pad;
    return [{ x: x1, y: slope * x1 + b }, { x: x2, y: slope * x2 + b }];
  }
  // The plain-English ITG sentence for a point.
  function cpSentence(pt, lever, ch, cmp) {
    var dir = pt.change >= 0 ? 'up' : 'down', sign = pt.change >= 0 ? 'increase' : 'decrease';
    var s = lever + ' for ' + pt.label + ' was ' + pt.primary + ', ' + dir +
            ' from ' + pt.secondary + ' (' + cmp + '), a ' + cpPctStr(pt.change) + ' ' + sign + '.';
    if (pt.x_delta !== undefined && pt.y_delta !== undefined) {
      s += ' There were ' + cpFmtDelta(pt.x_delta, ch.x_label) + ' and ' +
           cpFmtDelta(pt.y_delta, ch.y_label) + ' than ' + cmp + '.';
    }
    return s;
  }
  if (window.ANALYTICS_SCATTER) Object.keys(ANALYTICS_SCATTER).forEach(function(wid) {
    var widget = ANALYTICS_SCATTER[wid];
    var col = GROUP_COLORS[widget.group] || GROUP_COLORS.engage;
    // The selected comparison period (e.g. "Last Month" / "Same Month prior
    // year"), spelled out on the axes + readout instead of a hardcoded "YoY".
    var cmp = widget.compare_label || 'the prior period';
    widget.charts.forEach(function(ch, ci) {
      var el = document.getElementById('scatter-' + wid + '-' + ci);
      if (!el) return;
      // Plot the RAW change on each axis (x_delta, y_delta) instead of a %.
      var pts = ch.points.map(function(pt) { return { x: pt.x_delta, y: pt.y_delta }; });
      var ptColors = ch.points.map(function(pt) { return pt.color || col.line; });
      var readout = document.getElementById('readout-' + wid + '-' + ci);
      var lever = ch.heading.replace('Change in ', '');
      var trend = cpTrend(pts);

      new Chart(el.getContext('2d'), {
        type: 'scatter',
        data: {
          datasets: [
            { label: 'Trend', type: 'line', data: trend || [],
              borderColor: 'rgba(120,120,120,0.7)', borderWidth: 1, borderDash: [5, 4],
              fill: false, pointRadius: 0, showLine: true },
            { label: ch.heading, data: pts, backgroundColor: ptColors,
              pointBackgroundColor: ptColors, borderColor: 'rgba(255,255,255,0.55)',
              borderWidth: 1, pointRadius: 6, pointHoverRadius: 8, showLine: false }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          legend: { display: false },
          tooltips: {
            callbacks: {
              title: function() { return ''; },
              label: function(item) {
                if (item.datasetIndex === 0) return null;      // trend line
                var pt = ch.points[item.index];
                // Exactly three lines (three icons): rollover head + the two deltas.
                // The full plain-English sentence stays in the readout below.
                return [
                  pt.label + ':  ' + cpPctStr(pt.change) + '  (' + pt.secondary + ' → ' + pt.primary + ')',
                  cpFmtDelta(pt.x_delta, ch.x_label) + ' than ' + cmp,
                  cpFmtDelta(pt.y_delta, ch.y_label) + ' than ' + cmp
                ];
              }
            }
          },
          onHover: function(e, els) {
            if (!readout) return;
            if (!els || !els.length) { readout.textContent = 'Hover over a point to see details.'; return; }
            var el0 = els[0];
            if (el0._datasetIndex === 1) readout.textContent = cpSentence(ch.points[el0._index], lever, ch, cmp);
          },
          scales: {
            xAxes: [{ scaleLabel: { display: true, labelString: 'Change in ' + ch.x_label + ' vs ' + cmp, fontSize: 10 },
                      gridLines: { color: GRID, zeroLineColor: 'rgba(255,255,255,0.28)', zeroLineWidth: 1.2 },
                      ticks: { fontSize: 10, callback: cpAxisTick } }],
            yAxes: [{ scaleLabel: { display: true, labelString: 'Change in ' + ch.y_label + ' vs ' + cmp, fontSize: 10 },
                      gridLines: { color: GRID, zeroLineColor: 'rgba(255,255,255,0.28)', zeroLineWidth: 1.2 },
                      ticks: { fontSize: 10, callback: cpAxisTick } }]
          }
        }
      });
    });
  });
})();
</script>
